<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>배가스 계산기</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d242d">
<link rel="icon" href="icon-192.png">
<style>
  /* 어두운 화면 (현장에서 눈부시지 않게) */
  :root { color-scheme: dark; --bg: #14181d; --panel: #1d242d; --cell: #232b35; --line: #3d4856; --text: #eef1f5; --sub: #9aa6b4; --ok: #7ee2a8; --warn: #ff8a80; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; font-size: 16px; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; font-size: 19px; font-weight: bold; }
  main { padding: 12px 16px 40px; max-width: 520px; margin: 0 auto; }
  .out { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: center; min-height: 118px; }
  .o2 { font-size: 46px; font-weight: bold; color: var(--ok); line-height: 1.15; }
  .o2 small { font-size: 22px; color: var(--sub); font-weight: normal; }
  .sub { color: var(--sub); font-size: 15px; margin-top: 6px; line-height: 1.5; }
  .warn { color: var(--warn); font-size: 24px; font-weight: bold; line-height: 1.4; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  label { display: block; color: var(--sub); font-size: 14px; margin: 0 2px 4px; }
  input { width: 100%; font: inherit; font-size: 28px; color: var(--text); background: var(--cell); border: 1px solid var(--line); border-radius: 10px; padding: 12px 10px; }
  input:focus { outline: 2px solid #3a7bd5; }
  button { font: inherit; color: var(--text); background: var(--cell); border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%; margin-top: 12px; font-size: 17px; }
  details { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
  summary { padding: 12px 0; color: var(--sub); cursor: pointer; }
  details input { font-size: 20px; margin-bottom: 8px; }
  .info { color: var(--sub); font-size: 14px; line-height: 1.6; padding-bottom: 12px; }
</style>
</head>
<body>
<header>배가스 계산기</header>
<main>
  <div class="out" id="out"></div>
  <div class="grid">
    <div><label for="gas">Gas (Nm3/hr)</label><input id="gas" inputmode="decimal" autocomplete="off" oninput="calc()"></div>
    <div><label for="air">Air (Nm3/hr)</label><input id="air" inputmode="decimal" autocomplete="off" oninput="calc()"></div>
  </div>
  <button onclick="clearAll()">지우기</button>
  <details>
    <summary>발열량 · 계산 원리</summary>
    <label for="lhv">연료 저위발열량 (kcal/Nm3)</label>
    <input id="lhv" inputmode="numeric" autocomplete="off" oninput="calc()">
    <div class="info" id="info"></div>
  </details>
</main>
<script>
// 배가스 계산기 (2026-11-09): 운전 화면의 Gas·Air 유량을 넣으면 예상 배가스 O2를 바로 보여 줌.
// 기록은 남기지 않음. 앱을 오갈 때 값이 사라지지 않게 마지막 입력과 발열량만 이 폰에 기억
// 계수(저위발열량 1000 kcal당): KA = 이론공기량 Nm3, KC = 생기는 CO2 Nm3 (건조 기준이라 수증기는 뺌)
const KA = 1.108, KC = 0.119, LHV0 = 9150, KEY = 'flue-calc-v1';
const $ = id => document.getElementById(id);
const num = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(/,/g, '').trim()); return isFinite(n) ? n : null; };

// Gas·Air 유량 → 공기비 m, 예상 O2(건조 %). 공기 부족(m < 1)이면 o2 = null
function flueO2(g, a, lhv) {
  if (!g || !a || g <= 0 || a <= 0) return null;
  const k = (lhv || LHV0) / 1000, A0 = KA * k, m = a / (g * A0);   // A0: 연료 1 Nm3당 이론공기량
  if (m < 1) return { m, A0, o2: null };
  const ex = (m - 1) * A0, vd = KC * k + 0.79 * A0 + ex;              // ex: 남는 공기, vd: 건조 배가스량
  return { m, A0, o2: 0.21 * ex / vd * 100 };
}

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify({ g: $('gas').value, a: $('air').value, lhv: $('lhv').value })); } catch (e) {} }

function calc() {
  const lhv = num($('lhv').value) || LHV0, r = flueO2(num($('gas').value), num($('air').value), lhv);
  let h;
  if (!r) h = '<div class="sub" style="margin-top:30px">Gas·Air 유량을 둘 다 넣으면<br>예상 O2가 나와요</div>';
  else if (r.o2 == null) h = '<div class="warn">공기 부족</div><div class="sub">공기비 ' + r.m.toFixed(2) + ' · O2 거의 0%, CO 발생 위험<br>Air를 ' + Math.ceil(num($('gas').value) * r.A0).toLocaleString() + ' Nm3/hr 넘게 넣어야 완전연소</div>';
  else h = '<div class="o2">' + r.o2.toFixed(1) + '<small> %</small></div><div class="sub">예상 O2 (건조) · 공기비 ' + r.m.toFixed(2) + ' · 과잉공기 ' + ((r.m - 1) * 100).toFixed(0) + '%</div>';
  $('out').innerHTML = h;
  $('info').innerHTML = '지금 발열량 ' + lhv.toLocaleString() + ' 기준, Gas 1 Nm3를 남김없이 태우는 데 Air ' + (KA * lhv / 1000).toFixed(2) + ' Nm3가 필요해요(이론공기량).<br>' +
    '실제 Air ÷ 이론 Air = 공기비. 1보다 큰 만큼 공기가 남고, 그 안의 산소가 배가스 O2로 나와요. 그래서 O2는 유량 크기가 아니라 <b>Gas·Air 비율</b>로 정해져요.<br>' +
    '완전연소를 가정한 계산이에요. 실측이 훨씬 높으면 중간에 공기가 새는(레큐퍼레이터 파공 등) 단서가 될 수 있어요.';
  save();
}
function clearAll() { $('gas').value = ''; $('air').value = ''; calc(); $('gas').focus(); }

const s = load();
$('gas').value = s.g || ''; $('air').value = s.a || ''; $('lhv').value = s.lhv || LHV0;
calc();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
